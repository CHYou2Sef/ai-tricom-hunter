# ╔══════════════════════════════════════════════════════════════════════╗
# ║  docker-compose.yml — AI Tricom Hunter Industrial Stack              ║
# ║  Optimized for: Windows Host 8 GB RAM + HDD                         ║
# ║  Golden Path: SeleniumBase ► Nodriver ► CloakBrowser ► Crawl4AI     ║
# ╚══════════════════════════════════════════════════════════════════════╝

services:
  # ── 🤖 3-Layer Autonomous Supervisor ────────────────────────────────
  # Manages Layer 0 (Ingest), Layer 1 (Phone Hunter), Layer 2 (Social)
  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${GITHUB_REPOSITORY_OWNER:-youssef}/ai_tricom_hunter:v1.1.0-golden
    container_name: tricom_supervisor
    restart: unless-stopped

    # ── Industrial Chrome/Playwright settings ──
    shm_size: '2gb'   # Prevents Chrome "Aw, Snap!" crashes (shared memory)
    init: true        # Properly cleans up zombie browser processes
    ipc: host         # Zero-copy memory access for faster rendering

    # ── Resource caps (Windows 8 GB host, 2 workers max) ───────────────
    # Supervisor + 2 Chrome instances ≈ 3.5–4 GB peak
    # Leaving ~4 GB for the Windows host OS + Ollama
    mem_limit: 4g
    mem_reservation: 1g
    # Limit to 4 CPU cores (leave headroom for Windows OS)
    cpus: "4.0"

    environment:
      # CHROMIUM_BINARY_PATH: leave unset — config.find_chrome_executable() resolves
      # Patchright Playwright chromium (chrome-linux64/) first. Forcing
      # /usr/bin/google-chrome-stable broke when that symlink was missing or pointed
      # at a binary incompatible with SeleniumBase UC + bundled chromedriver.
      - DOCKER_ENV=true
      # NOTE: PYTHONPATH is intentionally NOT set here.
      # It caused numpy "import from source directory" errors by prepending
      # /app/src before site-packages. Path is managed by bootstrap.py.
      - LAYER0_ENABLED=true
      - LAYER2_ENABLED=true
      # Golden path explicit overrides (belt-and-suspenders with .env.prod)
      - PERFORMANCE_MODE=full
      - SELENIUM_ENABLED=false
      - CAMOUFOX_ENABLED=false
      - FIRECRAWL_ENABLED=false
      - JINA_ENABLED=false
      - CRAWLEE_ENABLED=false
      - BOTASAURUS_ENABLED=false
      # ── Tier 2 (SeleniumBase) temporary bypass ─────────────────────────
      # Chrome 147 hangs on UC-driver attach in this container image.
      # Boot directly on Tier 5 (Nodriver/CDP — no chromedriver needed).
      # Re-enable after rebuilding with a pinned Playwright/Patchright version.
      - SELENIUMBASE_ENABLED=true
      - HYBRID_DEFAULT_TIER=2
      # Fail fast if any browser tier hangs during startup (safety net)
      - BROWSER_STARTUP_TIMEOUT_SEC=60

    env_file:
      - .env.prod

    volumes:
      - ${HOST_WORK_DIR:-./WORK}:/app/WORK:Z
      - browser_profiles:/app/WORK/browser_profiles
      - ${HOST_LOG_DIR:-./logs}:/app/logs:Z
      - ./src:/app/src:ro,Z
      - ./run:/app/run:ro,Z
      - ./agent.yaml:/app/agent.yaml:ro,Z
      - ./SOUL.md:/app/SOUL.md:ro,Z
      - ./RULES.md:/app/RULES.md:ro,Z
      - /var/run/docker.sock:/var/run/docker.sock

    command: python run/supervisor.py

    ports:
      - "8000:8000"  # FastAPI metrics + health endpoint

    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; s=socket.socket(); s.connect(('8.8.8.8',53)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # Increased: allow time for Chromium first-launch

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Metrics Storage (monitoring profile — dev only) ───────────────
  # Start with: docker compose --profile monitoring up
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: tricom_prometheus
    user: root
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:z
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'   # Limit disk usage on HDD
    ports:
      - "9091:9090"
    restart: unless-stopped
    # Prometheus is lightweight
    mem_limit: 512m
    mem_reservation: 128m

  # ── Visualisation Dashboard (monitoring profile — dev only) ────────
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: tricom_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Reduce Grafana memory footprint
      - GF_SERVER_ENABLE_GZIP=true
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m

volumes:
  prometheus_data:
  grafana_data:
  browser_profiles:
